name: Hardware results

on:
  push:
    branches: [main, nvidia, metal, dcu, amd, metax]
    paths: ['docs/results/**', 'tools/render_hardware_results.py', 'tools/hardware_results.html', 'tests/contracts/test_hardware_results.py', '.github/workflows/hardware-results.yml']
  pull_request:
    paths: ['docs/results/**', 'tools/render_hardware_results.py', 'tools/hardware_results.html', 'tests/contracts/test_hardware_results.py', '.github/workflows/hardware-results.yml']

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install matplotlib==3.10.6
      - name: Check publication boundaries
        run: python -m unittest tests.contracts.test_hardware_results -v
      - name: Check the destination branch view
        env:
          RESULT_BRANCH: ${{ github.base_ref || github.ref_name }}
        shell: bash
        run: |
          case "$RESULT_BRANCH" in
            nvidia|metal|dcu|amd)
              python tools/render_hardware_results.py --platform "$RESULT_BRANCH" --check --figures ;;
            # MetaX has no published dataset yet; check its inherited aggregate view.
            main|metax)
              python tools/render_hardware_results.py --check --figures ;;
            *)
              echo "No maintained result destination: $RESULT_BRANCH" >&2
              exit 1 ;;
          esac
