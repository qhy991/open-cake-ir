name: CPU contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source checkout
        run: python -m pip install -e '.[test]'
      - name: Verify released corpus
        run: python -m open_cake_ir.cli compiler check-corpus --revision compiler/revision.lock.json
      - name: Run portable CPU contracts
        run: >-
          python -m unittest
          tests.contracts.test_ir
          tests.contracts.test_verifier
          tests.contracts.test_analysis
          tests.contracts.test_emit_triton
          tests.contracts.test_emit_cutedsl
          tests.contracts.test_python_frontend
          tests.contracts.test_cli
          tests.contracts.test_documentation
          tests.contracts.test_lab
          tests.contracts.test_authoring_environment
          tests.contracts.test_qsa_feedback
          tests.contracts.test_qsa_component_timing
          tests.contracts.test_routing
          tests.contracts.test_release_approval
          tests.contracts.test_compiled_resources
          tests.contracts.test_empirical_cost
          tests.contracts.test_profile_model
          tests.contracts.test_profile_report
          tests.contracts.test_empirical_cost_calibration
          tests.contracts.test_empirical_cost_fitter
          tests.contracts.test_metal
          tests.contracts.test_metal_runtime
          tests.contracts.test_tile_workloads
          tests.contracts.test_triton_loop_scopes
          tests.contracts.test_native_triton_pairing
          tests.contracts.test_metal_benchmark
          tests.contracts.test_tile_gpu_worker
