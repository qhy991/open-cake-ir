name: CPU contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source checkout
        run: python -m pip install -e '.[test]'
      - name: Verify released corpus
        run: python -m open_cake_ir.cli compiler check-corpus --revision compiler/revision.lock.json
      - name: Check undefined names
        run: python -m ruff check --select F821 src tools tests
      - name: Scan tracked files for credential shapes
        run: python tools/check_tracked_secrets.py
      - name: Discover and run all contract tests
        run: python -m pytest tests/contracts -ra
