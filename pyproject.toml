[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-cake-ir"
version = "0.1.0.dev0"
description = "Compiler-first independent reconstruction of Cake-like IR and its research lab"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4"]

[project.scripts]
open-cake-ir = "open_cake_ir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
