[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-cake-ir"
version = "0.1.0.dev0"
description = "Agent-driven co-evolution of GPU kernels and compiler capabilities"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/qhy991/open-cake-ir"
Issues = "https://github.com/qhy991/open-cake-ir/issues"

[project.optional-dependencies]
test = ["jsonschema>=4", "pytest>=8", "ruff>=0.12"]

[project.scripts]
open-cake-ir = "open_cake_ir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_cake_ir = ["tasks/qsa/assets/*.cu", "tasks/qsa/assets/*.json", "lab/metal/*.swift", "evaluation/metal/*.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
